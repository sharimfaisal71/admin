<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SFH Multistore Admin Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.loginBox{
    background:#1f2937;
    padding:30px;
    border-radius:12px;
    width:350px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#4285F4;
    color:white;
    font-size:16px;
}
#topbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#111827;
    color:white;
    padding:15px 25px;
    border-bottom:2px solid #4285F4;
}

#topbar .left{
    width:180px;
}

#topbar .center{
    flex:1;
    text-align:center;
}

#topbar .right{
    width:180px;
}

#topbar h1{
    margin:0;
    font-size:32px;
}

#logoutBtn{
    width:140px;
    padding:10px;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#logoutBtn:hover{
    background:#b91c1c;
}
.topbar{
    display:none;
}

#orders{
    display:none;
}
</style>
</head>

<body>
<header id="topbar">

    <div class="left">
        <button id="logoutBtn">🚪 Log Out</button>
    </div>

    <div class="center">
        <h1>SFH Orders</h1>
    </div>

    <div class="right"></div>

</header>
<div class="loginBox" id="loginBox">

<div id="login">

<h2>SFH Multistore Admin</h2>

<p>Please sign in with your Google account.</p>

<button id="loginBtn">
Sign in with Google
</button>

</div>

</div>
<div id="orders"></div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  setDoc,
  updateDoc,
  doc,
  getDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



  const firebaseConfig = {
  apiKey: "AIzaSyAIvnb6gO0HwwtNUeK69hXcs5_9Tvoq5io",
  authDomain: "sfh-multistore.firebaseapp.com",
  projectId: "sfh-multistore",
  storageBucket: "sfh-multistore.firebasestorage.app",
  messagingSenderId: "645514728433",
  appId: "1:645514728433:web:aefe52d615b1374302aa50",
  measurementId: "G-E8W2LKR9G3"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").onclick = function(){

signInWithPopup(auth, provider)
  .catch(error => {
    alert(error.message);
  });

};
onAuthStateChanged(auth, async function(user){

    if(!user){
        return;
    }



    document.getElementById("loginBox").style.display="none";

    document.getElementById("orders").style.display="block";
const q = query(
    collection(db, "orders"),
    orderBy("createdAt", "desc")
    );
    const snapshot = await getDocs(q);


console.log(snapshot.size);
let html = "";


snapshot.forEach(doc => {
  



    const order = doc.data();

    html += `
       <div><hr>
            <h3>${doc.id}</h3>
            <p>Name: ${order.name}</p>
            <p>Phone: ${order.phone}</p>
            <p>City: ${order.city}</p>
            <p>Address: ${order.address}</p>
            <p>Status: ${order.status}</p>
  <button onclick="addStatus('${doc.id}', '🔴 Cancelled/ Failed Delivery')">
        🔴 Cancelled/ Failed
    </button>
   <button onclick="addStatus('${doc.id}', '🟠 Processing')">
        🟠 Processing
    </button>

    <button onclick="addStatus('${doc.id}', '🟡 Shipped')">
        🟡 Shipped
    </button>

    <button onclick="addStatus('${doc.id}', ' 🟢 Delivered')">
        🟢 Delivered
    </button>
            <p>Total: ${order.total}</p>
            
        </div>
    `;

});
async function addStatus(invoiceNumber, newStatus) {

    const docRef = doc(db, "orders", invoiceNumber);

    const snap = await getDoc(docRef);

    if (!snap.exists()) {
        alert("Order not found.");
        return;
    }

    const order = snap.data();

if (newStatus == "🟡 Shipped") {
let tracker = prompt("Enter the DEX tracking number");
if (tracker && tracker.trim() !== "") { 
if ( 
confirm("Is " + tracker + " the DEX tracking number for " + invoiceNumber + "?")
) {
    let history = order.history ||  [];
let hereHTML = `! Your tracking number is <b>${tracker}</b>. Further tracking can be done <a href="https://www.dex.com.pk">
<b>here</b>
</a>.`
;
    history.unshift({
        status: newStatus + hereHTML,
        time: new Date().toLocaleString()
    });

    await updateDoc(docRef, {
        status: newStatus + hereHTML,
        history: history
    });

    alert("Status updated!");


}
} 
}else {


let history = order.history ||  [];
    history.unshift({
        status: newStatus,
        time: new Date().toLocaleString()
    });

    await updateDoc(docRef, {
        status: newStatus,
        history: history
    });

    alert("Status updated!");
}
}
window.addStatus = addStatus;
console.log(snapshot.size);

snapshot.forEach(doc => console.log(doc.id, doc.data()));
document.getElementById("orders").innerHTML = html;
    document.querySelector(".loginBox").style.display = "none";
document.getElementById("logoutBtn").onclick = async () => {

    await signOut(auth);

    location.reload();

};
document.querySelector("topbar").style.display = "flex";
});




</script>

</body>
</html>
