<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SFH Multistore Admin Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.loginBox{
    background:#1f2937;
    padding:30px;
    border-radius:12px;
    width:350px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#4285F4;
    color:white;
    font-size:16px;
}

#orders{
    display:none;
}
</style>
</head>

<body>

<div class="loginBox">

<div id="login">

<h2>SFH Multistore Admin</h2>

<p>Please sign in with your Google account.</p>

<button id="loginBtn">
Sign in with Google
</button>

</div>
<h2>SFH Orders</h2>
<div id="orders">

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    setDoc,
    updateDoc, 
    doc,
    getDoc,
    query,
    orderBy,
    getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";




  const firebaseConfig = {
  apiKey: "AIzaSyAIvnb6gO0HwwtNUeK69hXcs5_9Tvoq5io",
  authDomain: "sfh-multistore.firebaseapp.com",
  projectId: "sfh-multistore",
  storageBucket: "sfh-multistore.firebasestorage.app",
  messagingSenderId: "645514728433",
  appId: "1:645514728433:web:aefe52d615b1374302aa50",
  measurementId: "G-E8W2LKR9G3"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();
const db = getFirestore(app);
document.getElementById("loginBtn").onclick = function(){

signInWithPopup(auth, provider)
  .catch(error => {
    alert(error.message);
  });

};
onAuthStateChanged(auth,function(user){

    if(!user){
        return;
    }



    document.getElementById("login").style.display="none";

    document.getElementById("orders").style.display="block";

});
const q = query(
    collection(db, "orders"),
    orderBy("createdAt", "desc")
);

const snapshot = await getDocs(q);


console.log(snapshot.size);
let html = "";


snapshot.forEach(doc => {
  



    const order = doc.data();

    html += `
       <div><hr>
            <h3>${doc.id}</h3>
            <p>Name: ${order.name}</p>
            <p>Phone: ${order.phone}</p>
            <p>City: ${order.city}</p>
            <p>Address: ${order.address}</p>
            <p>Status: ${order.status}</p>
  <button onclick="addStatus('${doc.id}', '🔴 Cancelled/ Failed Delivery')">
        🔴 Cancelled/ Failed
    </button>
   <button onclick="addStatus('${doc.id}', '🟠 Processing')">
        🟠 Processing
    </button>

    <button onclick="addStatus('${doc.id}', '🟡 Shipped')">
        🟡 Shipped
    </button>

    <button onclick="addStatus('${doc.id}', ' 🟢 Delivered')">
        🟢 Delivered
    </button>
            <p>Total: ${order.total}</p>
            </hr>
        </div>
    `;

});
async function addStatus(invoiceNumber, newStatus) {

    const docRef = doc(db, "orders", invoiceNumber);

    const snap = await getDoc(docRef);

    if (!snap.exists()) {
        alert("Order not found.");
        return;
    }

    const order = snap.data();

if (newStatus == "🟡 Shipped") {
let tracker = prompt("Enter the DEX tracking number");
if (tracker > "") { 
if ( 
confirm("Is " + tracker + " the DEX tracking number for " + invoiceNumber + "?")
) {
    let history = order.history ||  [];
let hereHTML = `! Your tracking number is <b>${tracker}</b>. Further tracking can be done <a href="https://www.dex.com.pk">
<b>here</b>
</a>.`
;
    history.unshift({
        status: newStatus + hereHTML,
        time: new Date().toLocaleString()
    });

    await updateDoc(docRef, {
        status: newStatus + hereHTML,
        history: history
    });

    alert("Status updated!");


}
} 
}else {


let history = order.history ||  [];
    history.unshift({
        status: newStatus,
        time: new Date().toLocaleString()
    });

    await updateDoc(docRef, {
        status: newStatus,
        history: history
    });

    alert("Status updated!");
}
}
window.addStatus = addStatus;
console.log(snapshot.size);

snapshot.forEach(doc => console.log(doc.id, doc.data()));
document.getElementById("orders").innerHTML = html;
    
</script>

</body>
</html>
